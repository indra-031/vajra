rules:
  - id: js-hardcoded-secret
    message: Possible hardcoded secret in JavaScript
    severity: ERROR
    languages: [javascript]
    metadata:
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-regex: >
          (?i)
          (api[_-]?key
          |secret
          |token
          |access[_-]?key
          |auth[_-]?key
          |password)
          \s*
          ([:=])
          \s*
          ["'][^"'\s]{6,}["']
