rules:
  - id: html-hardcoded-secret
    message: Possible hardcoded secret in HTML / inline script
    severity: ERROR
    languages: [html]
    metadata:
      category: security
      confidence: MEDIUM
    pattern-regex: >
      (?i)
      (api[_-]?key
      |secret
      |token
      |access[_-]?key
      |auth[_-]?key
      |password)
      \s*
      ([:=])
      \s*
      ["'][^"'\s]{6,}["']
